name: Generate relation JSON files

on:
  push:
    branches:
      - main
    paths:
      - 'data/**/*.xml'  # Only run when XML data changes
      - 'generate-relations.py'
      - '.github/workflows/generate-relations.yml'
  workflow_dispatch:      # Allow manual trigger

jobs:
  generate-relations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml

      - name: Generate relation JSON files
        run: python3 generate-relations.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate relation JSON files from updated XML data"
          branch: chore/regenerate-relations
          title: "chore: regenerate relation JSON files"
          body: |
            Automated regeneration of relation JSON files.

            **Generated from:**
            - Updated entity XML files in `data/`
            - Latest relation extraction logic

            The script:
            1. Removes all existing JSON files
            2. Loads all entities and metadata
            3. Extracts relations from both dedicated files and entity embeddings
            4. Generates new JSON files only for entities with relations

            Please review the file diff to verify the changes are as expected.
          labels: automated
          delete-branch: true
